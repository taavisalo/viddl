[project]
name = "viddl"
version = "0.1.0"
description = "CLI utility to download YouTube videos in full quality"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Taavi" }
]
dependencies = [
  "yt-dlp>=2024.08.06",
]

[project.scripts]
viddl = "viddl.cli:main"

[build-system]
requires = ["hatchling>=1.20.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viddl"]
